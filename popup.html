<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFS-e Automático</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="44" height="44">
    <div><p class="eyebrow">EMISSOR NACIONAL</p><h1>NFS-e Automático</h1></div>
    <span id="version" class="version"></span>
  </header>
  <main>
    <ol aria-label="Etapas">
      <li id="people"><span>1</span>Pessoas</li><li id="service"><span>2</span>Serviço</li>
    </ol>
    <form id="fill-form">
      <div id="people-fields">
        <label for="cnpj">CNPJ do tomador</label>
        <input id="cnpj" name="cnpj" inputmode="numeric" autocomplete="off" maxlength="18" placeholder="Digite os 14 números" required aria-describedby="hint">
        <p id="hint">O mesmo CNPJ será usado para o destinatário quando o portal pedir esse campo.</p>
      </div>
      <button id="fill" disabled type="submit"><span id="fill-label">Preencher</span> <span aria-hidden="true">→</span></button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <footer><span>Emissão após revisão</span><a href="https://github.com/BlackGen3ral/nfse-automatico#atualiza%C3%A7%C3%B5es-pelo-github" target="_blank" rel="noreferrer">Atualizações ↗</a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
